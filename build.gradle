plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'pulsevisual' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java { withSourcesJar() }

tasks.register('visualRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.pulsevisual.VisualRegressionTest'
}
check.dependsOn visualRegression
tasks.register('updateRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.pulsevisual.UpdateRegressionTest'
}
check.dependsOn updateRegression
// This suite is a dependency-free executable, not a JUnit-discovered test.
tasks.named('test') { failOnNoDiscoveredTests = false }

// Isolated local-world integration tests; the test mod is not packaged in the release.
fabricApi.configureTests {
    createSourceSet = true
    modId = 'pulsevisual-test'
    enableGameTests = false
    enableClientGameTests = true
    clearRunDirectory = false
}
